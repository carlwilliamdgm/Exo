<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insertion d'image sur site Web</title>
  <style>
    @keyframes slide {
      0% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(900px);
      }

      100% {
        transform: translateX(0);
      }
    }

    .sliding-image {
      animation: slide 2s ease-in-out infinite;
    }
  </style>
</head>

<body>
  <p> Welcome on this Web Page designed by The Great Corporation</p>
  <p>San Goku Ultra instinct mode 😎</p>

  <img src="../../../Diaporama/th (1<<<<<<<<<<<<<<<<t).jpg" alt="Image du diaporama" width="400" class="sliding-image">

</body>

</html>

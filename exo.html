<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc en ciel</title>
    <style>
        body{
            background:linear-gradient(to right,rgb(231, 234, 235),rgb(230, 233, 234));
        }
        #a{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25%;
            width: 600px;
            height:600px ;
            border-radius: 50%;
            background-color: rgb(255,255,255,0.18);

        }
        #b{
            width: 600px;
            height:600px ;
            border-radius: 50%;
            border: solid rgb(255,255,255,0.18);
            background:linear-gradient(
            
             #8B00FF, /* Violet */
            #4B0082, /* Indigo */
            #0000FF, /* Bleu */
            #00FF00, /* Vert */
            #FFFF00, /* Jaune */
            #FF7F00, /* Orange */
            #FF0000  /* Rouge */);
        }
    </style>
</head>
<body>
    <div id="a">
        <div id="b">
        
        </div>

    </div>
</body>
</html>

<!DOCTYPE html>
<html>

<head>
  <style>
    .page {
      width: 600px;
    }

    .haut {
      background-color: #EE5555;
      padding: 20px;
    }

    .corps {
      display: flex;
      height: 350px;
    }

    .gauche {
      background-color: #6699FF;
      width: 25%;
    }

    .milieu {
      background-color: #44BB77;
      width: 50%;
    }

    .droite {
      background-color: #AA7744;
      width: 25%;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="haut">Zone du Haut</div>
    <div class="corps">
      <div class="gauche">Zone de Gauche</div>
      <div class="milieu">Zone du Milieu</div>
      <div class="droite">Zone de Droite</div>
    </div>
  </div>
</body>

</html>
